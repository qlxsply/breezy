name: Web Admin CI

on:
  pull_request:
    paths:
      - "web-admin/**"
      - ".github/workflows/web-admin-ci.yml"
  push:
    paths:
      - "web-admin/**"
      - ".github/workflows/web-admin-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-admin-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-admin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: npm
          cache-dependency-path: web-admin/package-lock.json

      - name: Pin npm
        run: npm install --global npm@11.13.0

      - name: Verify toolchain
        run: |
          node --version
          npm --version

      - name: Install
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Architecture
        run: npm run check:architecture

      - name: Unit and component tests
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Bundle budget
        run: npm run check:bundle

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-admin-failure-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            web-admin/playwright-report/
            web-admin/test-results/
            web-admin/dist/
