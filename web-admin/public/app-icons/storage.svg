<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 28 28">
  <!-- 云朵 - 位于上方 -->
  <path d="
    M 7 12
    C 4 12, 2 9.5, 2 7
    C 2 4.5, 4.5 3, 7 3
    C 7 1.5, 9 0.5, 11 0.5
    C 13.5 0.5, 15.5 2, 16 4
    C 17.5 3, 19.5 3.5, 20.5 5
    C 22.5 5.5, 24 7.5, 24 10
    C 24 11.5, 22.5 12, 21 12
    Z
  " fill="#5B9BD5" stroke="#4A8BC2" stroke-width="1"/>

  <!-- 云朵高光 -->
  <path d="
    M 4.5 8
    C 4.5 6, 6 5, 7.5 5
    C 7.5 4, 8.5 3.5, 9.5 3.5
  " fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- 文件夹主体 - 位于下方 -->
  <path d="
    M 3 14
    L 3 22
    C 3 23.5, 4 24.5, 5.5 24.5
    L 22.5 24.5
    C 24 24.5, 25 23.5, 25 22
    L 25 14
    C 25 12.5, 24 11.5, 22.5 11.5
    L 9 11.5
    L 6.5 9
    C 6 8.5, 5.5 8, 4.5 8
    L 3 8
    Z
  " fill="#F5C842" stroke="#E0B035" stroke-width="1"/>

  <!-- 文件夹标签（小tab） -->
  <path d="
    M 8 8
    L 8 11.5
    L 14 11.5
    L 12.5 8.5
    L 9 8
    Z
  " fill="#F5C842" stroke="#E0B035" stroke-width="0.8"/>

  <!-- 文件夹上的高光条纹 -->
  <line x1="5" y1="16" x2="23" y2="16" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="5" y1="19" x2="20" y2="19" stroke="rgba(255,255,255,0.2)" stroke-width="1" stroke-linecap="round"/>
  <line x1="5" y1="22" x2="18" y2="22" stroke="rgba(255,255,255,0.15)" stroke-width="1" stroke-linecap="round"/>

  <!-- 云朵与文件夹之间的连接线（上传/同步暗示） -->
  <path d="M 12 12.5 L 12 14.5" stroke="#4A8BC2" stroke-width="1.2" stroke-dasharray="1.5,1.5"/>
  <path d="M 16 12.5 L 16 14.5" stroke="#4A8BC2" stroke-width="1.2" stroke-dasharray="1.5,1.5"/>

  <!-- 向上的小箭头（上传寓意） -->
  <path d="M 10.5 15 L 12 13.5 L 13.5 15" fill="none" stroke="rgba(91,155,213,0.6)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 14.5 15 L 16 13.5 L 17.5 15" fill="none" stroke="rgba(91,155,213,0.6)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
