<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 28" width="28" height="28">
  <!-- 背景 -->
  <rect width="28" height="28" rx="6" fill="#1e1e2f" />

  <!-- 左花括号 -->
  <path d="M 10 6
           C 8 6, 7 7, 7 9
           L 7 12
           C 7 13.5, 6 14, 6 14
           C 6 14, 7 14.5, 7 16
           L 7 19
           C 7 21, 8 22, 10 22"
        stroke="#b0b5c0" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 右花括号 -->
  <path d="M 18 6
           C 20 6, 21 7, 21 9
           L 21 12
           C 21 13.5, 22 14, 22 14
           C 22 14, 21 14.5, 21 16
           L 21 19
           C 21 21, 20 22, 18 22"
        stroke="#b0b5c0" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 闪电（向左移动并微调） -->
  <polygon points="14.5,6.5 10.5,15.5 13,15.5 11.5,21.5 17.5,12.5 15,12.5 16,6.5"
           fill="#FFD700" stroke="#FFC107" stroke-width="0.5" stroke-linejoin="round"/>
