<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 28 28">
  <!-- 背景日历主体 - 白色圆角矩形 -->
  <rect x="2" y="4" width="24" height="22" rx="3" fill="white" stroke="#2C3E50" stroke-width="1.8"/>

  <!-- 日历顶部红色色带（装饰条） -->
  <rect x="2" y="4" width="24" height="6" rx="3" fill="#E74C3C"/>
  <rect x="2" y="7" width="24" height="3" fill="#E74C3C"/>

  <!-- 日历左上角挂环 -->
  <circle cx="9" cy="4" r="2.5" fill="white" stroke="#2C3E50" stroke-width="1.5"/>
  <circle cx="19" cy="4" r="2.5" fill="white" stroke="#2C3E50" stroke-width="1.5"/>

  <!-- 日历日期数字 -->
  <text x="14" y="19" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#2C3E50" text-anchor="middle" dominant-baseline="middle">16</text>

  <!-- 红色提醒角标 - 位于右上角 -->
  <circle cx="23" cy="7" r="5" fill="#E74C3C" stroke="white" stroke-width="1.5"/>

  <!-- 角标内的数字（代表待办数量） -->
  <text x="23" y="8.5" font-family="Arial, Helvetica, sans-serif" font-size="6" font-weight="bold" fill="white" text-anchor="middle" dominant-baseline="middle">3</text>

  <!-- 底部两条横线（代表日程列表） -->
  <rect x="5" y="21" width="7" height="1.5" rx="0.75" fill="#BDC3C7"/>
  <rect x="5" y="24" width="5" height="1.5" rx="0.75" fill="#BDC3C7"/>
</svg>
