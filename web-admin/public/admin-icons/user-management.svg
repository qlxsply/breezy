<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <!-- 外部注册客户卡片底座 (无边框轻量色块) -->
  <rect x="2.5" y="3" width="14" height="18" rx="3" fill="#EFF6FF"/>

  <!-- 客户头像与注册标记 -->
  <circle cx="7.5" cy="7.5" r="2" fill="#2563EB"/>
  <path d="M4.5 13c0-1.6 1.3-2.5 3-2.5s3 .9 3 2.5" stroke="#2563EB" stroke-width="1.5" stroke-linecap="round"/>

  <!-- 客户明细/查询线条 -->
  <path d="M11.5 7h2.5" stroke="#3B82F6" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M4.5 15.5h6" stroke="#93C5FD" stroke-width="1.5" stroke-linecap="round"/>

  <!-- 右下角：客户账号状态控制开关 (Enable/Disable Switch) -->
  <rect x="11.5" y="13.5" width="10" height="6" rx="3" fill="#2563EB"/>
  <circle cx="18.5" cy="16.5" r="2" fill="#EFF6FF"/>
</svg>
